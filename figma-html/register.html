<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TourGo - Đăng ký</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="phone-frame">
        <div class="top-wave"></div>
        <div class="content" style="margin-top: 74px">
          <div class="brand">
            <div class="brand-logo">TG</div>
            <span>TourGo</span>
          </div>

          <h1 class="title">Tạo tài khoản</h1>
          <p class="subtitle">
            Đăng ký nhanh để lưu tour yêu thích, nhận ưu đãi và quản lý đặt chỗ dễ dàng.
          </p>

          <form class="form">
            <div class="field">
              <label>Họ và tên</label>
              <input type="text" placeholder="Nguyễn Văn A" />
            </div>

            <div class="field">
              <label>Email</label>
              <input type="email" placeholder="you@example.com" />
            </div>

            <div class="field">
              <label>Số điện thoại</label>
              <input type="tel" placeholder="09xx xxx xxx" />
            </div>

            <div class="field">
              <label>Mật khẩu</label>
              <input type="password" placeholder="Tối thiểu 8 ký tự" />
            </div>

            <label class="checkbox">
              <input type="checkbox" /> Tôi đồng ý với điều khoản sử dụng
            </label>

            <button class="button button-primary" type="button">Đăng ký</button>
          </form>

          <p class="bottom-text">
            Đã có tài khoản?
            <a href="login.html">Đăng nhập</a>
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
