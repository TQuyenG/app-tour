<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TourGo - Đăng nhập</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="phone-frame">
        <div class="top-wave"></div>
        <div class="content" style="margin-top: 88px">
          <div class="brand">
            <div class="brand-logo">TG</div>
            <span>TourGo</span>
          </div>

          <h1 class="title">Đăng nhập</h1>
          <p class="subtitle">
            Khám phá hành trình mơ ước của bạn với hàng ngàn tour ưu đãi mỗi ngày.
          </p>

          <form class="form">
            <div class="field">
              <label>Email</label>
              <input type="email" placeholder="you@example.com" />
            </div>

            <div class="field">
              <label>Mật khẩu</label>
              <input type="password" placeholder="Nhập mật khẩu" />
            </div>

            <div class="row">
              <label class="checkbox">
                <input type="checkbox" /> Ghi nhớ đăng nhập
              </label>
              <a href="#" class="text-link">Quên mật khẩu?</a>
            </div>

            <button class="button button-primary" type="button">Đăng nhập</button>
            <button class="button button-ghost" type="button">
              Đăng nhập với Google
            </button>
          </form>

          <div class="divider">hoặc</div>

          <p class="bottom-text">
            Chưa có tài khoản?
            <a href="register.html">Đăng ký ngay</a>
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
